services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: photobooth
      POSTGRES_USER: photobooth
      POSTGRES_PASSWORD: photobooth
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - photobooth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  photobooth-postgres-data:
